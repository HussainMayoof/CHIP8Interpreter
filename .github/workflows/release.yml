name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    -   os: ubuntu-latest
                        artifact_name: HelloCHIP-Linux.tar.gz
                    -   os: windows-latest
                        artifact_name: HelloCHIP-Windows.zip
                    -   os: macos-latest
                        artifact_name: HelloCHIP-macOS.tar.gz

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Build with PyInstaller
              run: |
                uv sync
                uv run pyinstaller gui.spec

            - name: Package (Linux/macOS)
              if: runner.os != 'Windows'
              run: tar -czf ${{ matrix.artifact_name }} -C dist HelloCHIP

            - name: Package (Windows)
              if: runner.os == 'Windows'
              run: Compress-Archive -Path dist/HelloCHIP -DestinationPath ${{ matrix.artifact_name }}
              shell: pwsh

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_name }}

    release:
        name: Create GitHub release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Download all artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts

            -   name: Flatten artifacts
                run: |
                    mkdir -p release
                    find artifacts -type f -exec mv {} release/ \;

            -   name: Create release
                uses: softprops/action-gh-release@v3
                with:
                    files: release/*
                    name: "${{ github.ref_name }} - HelloCHIP"
                    generate_release_notes: true